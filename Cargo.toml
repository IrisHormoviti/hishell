[package]
name = "hishell"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Toolkit-agnostic core for the Hishell file manager"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "7.0.0"
libc = "0.2"
once_cell = "1.18"
flate2 = "1.1"
zstd = "0.14"
mime_guess = "2.0"
infer = "0.22"
crossbeam-channel = "0.5"
filetime = "0.2"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
trash = "5.2"

[workspace]
